name: Convert README.md -> README.html 
on: 
  push: # watch only README.md files (ignore README.html to be safe) 
    paths: 
      - '**/README.md'

jobs: 
  convert: 
    runs-on: ubuntu-latest 
    
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          persist-credentials: true # allow pushing back
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (if package.json present)
        run: |
          if [ -f "$GITHUB_WORKSPACE/util/package.json" ]; then 
            npm ci --prefix "$GITHUB_WORKSPACE/util" 
          fi
      
      - name: Convert README.md files (run convert.js from README folder)
        env:
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
      
          # Relative path (inside repo) to where convert.js and style.css live
          CONVERTER_DIR="util" 
          CONVERTER_SCRIPT="$CONVERTER_DIR/convert.js"

          # Absolute path to converter in the runner workspace
          # GITHUB_WORKSPACE is automatically set to the repository root
          ABS_CONVERTER_SCRIPT="${GITHUB_WORKSPACE:-$PWD}/$CONVERTER_SCRIPT"

          if [ ! -f "$ABS_CONVERTER_SCRIPT" ]; then 
            echo "Converter script not found at $ABS_CONVERTER_SCRIPT" 
            exit 1 
          fi

          changed=false
          
          # Find all tracked README.md files
          mapfile -t files < <(git ls-files | grep -E '(^|/)README\.md$' || true)
          
          if [ "${#files[@]}" -eq 0 ]; then 
            echo "No README.md files found." 
            exit 0 
          fi
          
          for md in "${files[@]}"; do
            dir=$(dirname "$md")
            # If README.md is in repository root, dirname returns "."
            if [ "$dir" = "." ]; then
              workdir="$PWD"
              gitPath="README.html"
              pageTitle="$(basename "$PWD")"
            fi
  
            if [ "$dir" != "." ]; then
              workdir="$PWD/$dir"
              gitPath="$dir/README.html"
              pageTitle="$(basename "$dir")"
            fi
            
            echo "Processing $md (workdir: $workdir)"
            
            # Remove existing README.html if present so convert.js can create a fresh file
            if [ -f "$workdir/README.html" ]; then
              rm "$workdir/README.html"
              echo "Removed existing $workdir/README.html"
            fi
            
            # Run the converter from inside the README.md folder.
            # Use node <path-to-convert.js>. convert.js reads style.css relative to its own folder (__dirname).
            (
              cd "$workdir"
              node "$ABS_CONVERTER_SCRIPT" "$pageTitle"
            ) || { echo "Conversion failed for $md"; exit 1; }
            
            # If convert.js wrote README.html, stage it.
            if [ -f "$workdir/README.html" ]; then
              git add "$gitPath"
              changed=true
            fi
          done
          
          if [ "$changed" = true ]; then
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git commit -m "Auto-generate README.html from README.md [skip ci]" || echo "Nothing to commit"
            git push origin HEAD
          fi
          
          if [ "$changed" != true ]; then
            echo "No generated files to commit."
          fi

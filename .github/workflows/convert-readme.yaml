name: Convert README.md -> README.html 
on: 
  push: # watch only README.md files (ignore README.html to be safe) 
    paths: 
      - '**/README.md'

jobs: 
  convert: 
    runs-on: ubuntu-latest 
    
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          persist-credentials: true # allow pushing back
          fetch-depth: 0 # fetch full history to enable commit comparisons
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (if package.json present)
        run: |
          if [ -f "$GITHUB_WORKSPACE/util/package.json" ]; then 
            npm ci --prefix "$GITHUB_WORKSPACE/util" 
          fi
      
      - name: Convert README.md files (run convert.js from README folder)
        env:
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
      
          # Path to converter script
          CONVERTER_SCRIPT="${GITHUB_WORKSPACE:-$PWD}/util/convert.js"
          
          if [ ! -f "$CONVERTER_SCRIPT" ]; then 
            echo "Converter script not found at $CONVERTER_SCRIPT" 
            exit 1 
          fi

          changed=false
          
          # Find modified README.md files using GitHub event payload or git diff fallback
          get_modified_files() {
            if [ -f "$GITHUB_EVENT_PATH" ]; then
              jq -r '[.commits[] | .added[]?, .modified[]?] | unique | .[] | select(. != null and . != "")' "$GITHUB_EVENT_PATH" | grep -E '(^|/)README\.md$' || true
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              git diff --name-only HEAD~1 HEAD | grep -E '(^|/)README\.md$' || true
            else
              echo "No previous commit available, processing all README.md files" >&2
              git ls-files | grep -E '(^|/)README\.md$' || true
            fi
          }
          
          # Get files and filter out empty lines in one step
          mapfile -t files < <(get_modified_files | grep -v '^$')
          
          if [ "${#files[@]}" -eq 0 ]; then 
            echo "No modified README.md files found in this push." 
            exit 0 
          fi
          
          echo "Found ${#files[@]} modified README.md file(s):"
          printf '  %s\n' "${files[@]}"
          
          for md in "${files[@]}"; do
            # Skip if the file doesn't exist (might have been deleted)
            if [ ! -f "$md" ]; then
              echo "Skipping deleted file: $md"
              continue
            fi
            
            dir=$(dirname "$md")
            # Set paths based on whether file is in root or subdirectory
            if [ "$dir" = "." ]; then
              workdir="$PWD"
              gitPath="README.html" 
              pageTitle="$(basename "$PWD")"
            else
              workdir="$PWD/$dir"
              gitPath="$dir/README.html"
              pageTitle="$(basename "$dir")"
            fi
            
            echo "Processing $md (workdir: $workdir)"
            
            # Remove existing README.html if present so convert.js can create a fresh file
            if [ -f "$workdir/README.html" ]; then
              rm "$workdir/README.html"
              echo "Removed existing $workdir/README.html"
            fi
            
            # Run the converter from the target directory
            (cd "$workdir" && node "$CONVERTER_SCRIPT" "$pageTitle") || { 
              echo "Conversion failed for $md"; exit 1; 
            }
            
            # Post-process the generated HTML file
            if [ -f "$workdir/README.html" ]; then
              echo "Post-processing $workdir/README.html"
              
              # Determine directory type and check for .slx files
              case "$workdir" in
                *"/Examples/"*) 
                  directory_type="Examples"
                  has_slx_files=$([ -n "$(ls "$workdir"/*.slx 2>/dev/null)" ] && echo "true" || echo "false") ;;
                *"/Tutorials/"*) 
                  directory_type="Tutorials" 
                  has_slx_files="false" ;;
                *) 
                  directory_type=""
                  has_slx_files="false" ;;
              esac
              
              # Run the post-processing script to apply MATLAB-compatible transformations
              python3 "${GITHUB_WORKSPACE}/util/post-process-html.py" "$workdir/README.html" "$dir" "$directory_type" "$has_slx_files" || {
                echo "Post-processing failed for $md"
                exit 1
              }
              
              echo "Post-processing completed for $workdir/README.html"
              
              # Stage the processed HTML file
              git add "$gitPath"
              changed=true
            fi
          done
          
          # Commit and push changes if any files were processed
          if [ "$changed" = true ]; then
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git commit -m "Auto-generate README.html from modified README.md files [skip ci]" || echo "Nothing to commit"
            git push origin HEAD
          else
            echo "No generated files to commit."
          fi

name: Convert README.md -> README.html 
on: 
  push: # watch only README.md files (ignore README.html to be safe) 
    paths: 
      - '**/README.md'

jobs: 
  convert: 
    runs-on: ubuntu-latest 
    
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          persist-credentials: true # allow pushing back
          fetch-depth: 0 # fetch full history to enable commit comparisons
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (if package.json present)
        run: |
          if [ -f "$GITHUB_WORKSPACE/util/package.json" ]; then 
            npm ci --prefix "$GITHUB_WORKSPACE/util" 
          fi
      
      - name: Convert README.md files (run convert.js from README folder)
        env:
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
      
          # Relative path (inside repo) to where convert.js and style.css live
          CONVERTER_DIR="util" 
          CONVERTER_SCRIPT="$CONVERTER_DIR/convert.js"

          # Absolute path to converter in the runner workspace
          # GITHUB_WORKSPACE is automatically set to the repository root
          ABS_CONVERTER_SCRIPT="${GITHUB_WORKSPACE:-$PWD}/$CONVERTER_SCRIPT"

          if [ ! -f "$ABS_CONVERTER_SCRIPT" ]; then 
            echo "Converter script not found at $ABS_CONVERTER_SCRIPT" 
            exit 1 
          fi

          changed=false
          
          # Find only README.md files that were modified in this push
          # Try GitHub event payload first, fall back to git diff if needed
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            # Use mapfile to properly handle the pipeline and avoid empty elements
            mapfile -t files < <(jq -r '[.commits[] | .added[]?, .modified[]?] | unique | .[] | select(. != null and . != "")' "$GITHUB_EVENT_PATH" | grep -E '(^|/)README\.md$' || true)
            
            # If no files found in event payload, fall back to git diff
            if [ "${#files[@]}" -eq 0 ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                mapfile -t files < <(git diff --name-only HEAD~1 HEAD | grep -E '(^|/)README\.md$' || true)
              else
                echo "No previous commit available, processing all README.md files"
                mapfile -t files < <(git ls-files | grep -E '(^|/)README\.md$' || true)
              fi
            fi
          else
            echo "GITHUB_EVENT_PATH not found, falling back to git diff method."
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              mapfile -t files < <(git diff --name-only HEAD~1 HEAD | grep -E '(^|/)README\.md$' || true)
            else
              mapfile -t files < <(git ls-files | grep -E '(^|/)README\.md$' || true)
            fi
          fi
          
          # Filter out any empty elements from the array
          filtered_files=()
          for file in "${files[@]}"; do
            if [ -n "$file" ] && [ "$file" != "" ]; then
              filtered_files+=("$file")
            fi
          done
          files=("${filtered_files[@]}")
          
          if [ "${#files[@]}" -eq 0 ]; then 
            echo "No modified README.md files found in this push." 
            exit 0 
          fi
          
          echo "Found ${#files[@]} modified README.md file(s):"
          printf '  %s\n' "${files[@]}"
          
          for md in "${files[@]}"; do
            # Skip if the file doesn't exist (might have been deleted)
            if [ ! -f "$md" ]; then
              echo "Skipping deleted file: $md"
              continue
            fi
            
            dir=$(dirname "$md")
            # If README.md is in repository root, dirname returns "."
            if [ "$dir" = "." ]; then
              workdir="$PWD"
              gitPath="README.html"
              pageTitle="$(basename "$PWD")"
            fi
  
            if [ "$dir" != "." ]; then
              workdir="$PWD/$dir"
              gitPath="$dir/README.html"
              pageTitle="$(basename "$dir")"
            fi
            
            echo "Processing $md (workdir: $workdir)"
            
            # Remove existing README.html if present so convert.js can create a fresh file
            if [ -f "$workdir/README.html" ]; then
              rm "$workdir/README.html"
              echo "Removed existing $workdir/README.html"
            fi
            
            # Run the converter from inside the README.md folder.
            # Use node <path-to-convert.js>. convert.js reads style.css relative to its own folder (__dirname).
            (
              cd "$workdir"
              node "$ABS_CONVERTER_SCRIPT" "$pageTitle"
            ) || { echo "Conversion failed for $md"; exit 1; }
            
            # Post-process the generated HTML file
            if [ -f "$workdir/README.html" ]; then
              echo "Post-processing $workdir/README.html"
              
              # Determine directory type and check for .slx files for button insertion
              directory_type=""
              has_slx_files="false"
              
              if [[ "$workdir" == *"/Examples/"* ]]; then
                directory_type="Examples"
                # Check if this directory contains .slx files
                if ls "$workdir"/*.slx >/dev/null 2>&1; then
                  has_slx_files="true"
                fi
              elif [[ "$workdir" == *"/Tutorials/"* ]]; then
                directory_type="Tutorials"
              fi
              
              # Run the post-processing script to apply MATLAB-compatible transformations
              python3 "${GITHUB_WORKSPACE}/util/post-process-html.py" "$workdir/README.html" "$dir" "$directory_type" "$has_slx_files" || {
                echo "Post-processing failed for $md"
                exit 1
              }
              
              echo "Post-processing completed for $workdir/README.html"
              
              # Stage the processed HTML file
              git add "$gitPath"
              changed=true
            fi
          done
          
          if [ "$changed" = true ]; then
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git commit -m "Auto-generate README.html from modified README.md files [skip ci]" || echo "Nothing to commit"
            git push origin HEAD
          fi
          
          if [ "$changed" != true ]; then
            echo "No generated files to commit."
          fi

# Workflow to validate Simulink models in the repository
# Checks for DUT subsystem and Hub block platform configuration

name: MATLAB Model Validation

on:
  push:
    paths:
      - '**.slx'
  pull_request:
    paths:
      - '**.slx'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Simulink

      - name: Detect modified .slx files
        id: detect-slx
        run: |
          # Determine base reference for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            # First commit - check all .slx files in repository
            base_ref=""
          fi
          
          # Get modified .slx files
          if [ -n "$base_ref" ]; then
            echo "Detecting .slx files changed since $base_ref"
            changed_files=$(git diff --name-only "$base_ref" "${{ github.sha }}" | grep '\.slx$')
          else
            echo "First commit - checking all .slx files in repository"
            changed_files=$(git ls-files '*.slx')
          fi
          
          # Display and save results
          echo "Found .slx files:"
          echo "$changed_files"
          echo "$changed_files" > slx_files.txt
          
          # Count files
          file_count=$(echo "$changed_files" | wc -l)
          echo "file_count=$file_count" >> $GITHUB_OUTPUT

      - name: Run model validation
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('util'); validate_models();
